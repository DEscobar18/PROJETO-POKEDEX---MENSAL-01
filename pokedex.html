<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./style.css">
</style>
</head>

<body>
    <img src="./pokedex.png" alt="Pokémon">
    <h1>Pokédex Pro</h1>
    <p> Sua Jornada Pokémon começa aqui!</p>
    <div class="login">
        <form id="loginPokedex">

            <label for="login">E-mail:</label>

            <input type="email" id="login" placeholder="treinador@pokedex.pro" required>

            <label for="password">Senha:</label>

            <input type="password" id="password" placeholder="Sua senha secreta" required>
            <a class="forgot-password" href="registro.html">Esqueceu senha?</a>
        </form>
    </div>
    <script src="./js/script.js"></script>
</body>

<footer>
    <button type="submit">Entrar</button>
    <p class="creat-acount">Ainda não tem uma conta?
        <a class="creat-account" href="registro.html">Criar conta</a>
    </p>
</footer>

</html>
