<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex - Registro</title>
    <link rel="stylesheet" href="./registro.css">
</head>

<body>
    <h1>Registro de Usuário</h1>
    <p>Por favor, preencha os campos abaixo para se registrar:</p>

    <div class="registro">
        <form id="registroPokedex">
            <label for="name">Nome de Usuário:</label>
            <input type="text" id="name" placeholder="podexgamer" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="treinador@pokedex.pro" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" placeholder="Sua senha secreta" required>

            <button type="submit">Registrar</button>
            <button type="button" onclick="window.location.href='pokedex.html'">Cancelar</button>
        </form>

    </div>
</body>

</html>
